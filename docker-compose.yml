name: assetflow

x-business-environment: &business-environment
  CONFIG_SERVER_URL: configserver:http://config-service:8888
  EUREKA_URL: http://eureka-service:8761/eureka/
  MYSQL_HOST: mysql
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-assetflow-dev}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: assetflow
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-assetflow-dev}

x-business-depends-on: &business-depends-on
  config-service:
    condition: service_healthy
  mysql:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-assetflow-dev}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: assetflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-assetflow-dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: assetflow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  eureka-service:
    build:
      context: ../eureka-service
      dockerfile: deploy/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8761'"]
      interval: 5s
      timeout: 3s
      retries: 30

  config-service:
    build:
      context: ../config-service
      dockerfile: deploy/Dockerfile
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      eureka-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway-service:
    build:
      context: ../gateway-service
      dockerfile: deploy/Dockerfile
    environment:
      CONFIG_SERVER_URL: configserver:http://config-service:8888
      EUREKA_URL: http://eureka-service:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      config-service:
        condition: service_healthy

  identity-service:
    build:
      context: ../identity-service
      dockerfile: deploy/Dockerfile
    environment: *business-environment
    depends_on: *business-depends-on

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: deploy/Dockerfile
    environment: *business-environment
    depends_on: *business-depends-on

  assignment-service:
    build:
      context: ../assignment-service
      dockerfile: deploy/Dockerfile
    environment: *business-environment
    depends_on: *business-depends-on

  maintenance-service:
    build:
      context: ../maintenance-service
      dockerfile: deploy/Dockerfile
    environment: *business-environment
    depends_on: *business-depends-on

  audit-service:
    build:
      context: ../audit-service
      dockerfile: deploy/Dockerfile
    environment: *business-environment
    depends_on: *business-depends-on

  mail-service:
    build:
      context: ../mail-service
      dockerfile: deploy/Dockerfile
    environment:
      <<: *business-environment
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      <<: *business-depends-on
      mailpit:
        condition: service_started

  assetflow-web:
    build:
      context: ../assetflow-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      gateway-service:
        condition: service_started

volumes:
  mysql-data:
